name: pr

on:
  pull_request:
    branches: [main]

jobs:
  pr:
    name: pr
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-windows

      - run: mise exec -- cargo build --release
